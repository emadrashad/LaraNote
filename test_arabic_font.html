<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Arabic Font Integration</title>
    <style>
        body {
            font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .arabic-text {
            font-size: 18px;
            margin: 10px 0;
        }
        .highlight {
            background: #ffec80;
            padding: 2px 4px;
            border-radius: 3px;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background: #f8f9fa;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Arabic Font Integration Test</h1>
    
    <div class="test-section">
        <h2>Font Loading Test</h2>
        <button onclick="testFontLoading()">Test Font Loading</button>
        <div id="fontStatus" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Arabic Text Display</h2>
        <div class="arabic-text" lang="ar" dir="rtl">
            هذا نص عربي للاختبار. يجب أن يظهر بخط Playpen Sans Arabic عند تفعيل الخط.
        </div>
        <div class="arabic-text" lang="ar" dir="rtl">
            <span class="highlight">هذا النص المظلل</span> يجب أن يظهر أيضاً بالخط العربي.
        </div>
    </div>

    <div class="test-section">
        <h2>Language Switching Test</h2>
        <button onclick="setLanguage('en')">English</button>
        <button onclick="setLanguage('ar')">العربية</button>
        <div id="langStatus" class="status">Current language: <span id="currentLang">en</span></div>
    </div>

    <div class="test-section">
        <h2>Extension Integration Test</h2>
        <button onclick="testExtensionIntegration()">Test Extension Fonts</button>
        <div id="extensionStatus" class="status"></div>
    </div>

    <script>
        // Test font loading
        async function testFontLoading() {
            const status = document.getElementById('fontStatus');
            try {
                // Check if we can access the extension's font file
                const fontUrl = chrome.runtime.getURL('fonts/PlaypenSansArabic-VariableFont_wght.ttf');
                
                // Create a temporary element to test the font
                const testElement = document.createElement('div');
                testElement.style.position = 'absolute';
                testElement.style.left = '-9999px';
                testElement.style.fontFamily = 'Playpen Sans Arabic, serif';
                testElement.textContent = 'مرحبا بالعالم';
                document.body.appendChild(testElement);
                
                // Check if font is applied
                const appliedFont = window.getComputedStyle(testElement).fontFamily;
                document.body.removeChild(testElement);
                
                status.className = 'status success';
                status.textContent = `Font test completed. Applied font: ${appliedFont}`;
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Font loading error: ${error.message}`;
            }
        }

        // Test language switching
        async function setLanguage(lang) {
            const status = document.getElementById('langStatus');
            const currentLang = document.getElementById('currentLang');
            
            try {
                await chrome.storage.local.set({ lang: lang });
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                currentLang.textContent = lang;
                
                status.className = 'status success';
                status.textContent = `Language switched to: ${lang === 'ar' ? 'Arabic' : 'English'}`;
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Language switching error: ${error.message}`;
            }
        }

        // Test extension integration
        async function testExtensionIntegration() {
            const status = document.getElementById('extensionStatus');
            
            try {
                // Check if extension is loaded
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Extension not available');
                }
                
                // Test getting the font URL
                const fontUrl = chrome.runtime.getURL('fonts/PlaypenSansArabic-VariableFont_wght.ttf');
                
                // Test language setting
                const result = await chrome.storage.local.get(['lang']);
                const currentLang = result.lang || 'en';
                
                status.className = 'status success';
                status.innerHTML = `
                    <strong>Extension Integration Test Results:</strong><br>
                    ✓ Extension runtime available<br>
                    ✓ Font URL accessible: ${fontUrl}<br>
                    ✓ Current language: ${currentLang}<br>
                    ✓ Arabic font CSS should be injected
                `;
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Extension integration error: ${error.message}`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const result = await chrome.storage.local.get(['lang']);
                const lang = result.lang || 'en';
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.getElementById('currentLang').textContent = lang;
            } catch (error) {
                console.log('Could not access extension storage:', error);
            }
        });
    </script>
</body>
</html>
