<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LaraNote Settings Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { margin: 5px; padding: 10px; }
        #console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 15px; 
            margin-top: 20px; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 300px; 
            overflow-y: auto; 
        }
    </style>
</head>
<body>
    <h1>LaraNote Settings Functionality Test</h1>
    
    <div id="test-results"></div>
    
    <div>
        <button onclick="testSettingsButton()">Test Settings Button</button>
        <button onclick="testSaveButton()">Test Save Button</button>
        <button onclick="testExportButton()">Test Export Button</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <h3>Console Output:</h3>
    <div id="console-output"></div>
    
    <script>
        // Override console.log to capture output
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function captureConsole() {
            console.log = function(...args) {
                originalConsoleLog.apply(console, args);
                consoleOutput.textContent += args.join(' ') + '\n';
            };
            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                consoleOutput.textContent += 'ERROR: ' + args.join(' ') + '\n';
            };
        }
        
        function clearConsole() {
            consoleOutput.textContent = '';
        }
        
        function addTestResult(testName, passed, message) {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${testName}:</strong> ${passed ? 'PASS' : 'FAIL'} - ${message}`;
            results.appendChild(div);
        }
        
        function testSettingsButton() {
            console.log('=== Testing Settings Button ===');
            
            // Check if settings button exists
            const settingsBtn = document.getElementById('settings-btn');
            if (!settingsBtn) {
                addTestResult('Settings Button Exists', false, 'Settings button not found in DOM');
                return;
            }
            
            addTestResult('Settings Button Exists', true, 'Settings button found');
            
            // Check if showSettings function exists
            if (typeof showSettings !== 'function') {
                addTestResult('showSettings Function', false, 'showSettings function not found');
                return;
            }
            
            addTestResult('showSettings Function', true, 'showSettings function exists');
            
            // Try to trigger click
            try {
                settingsBtn.click();
                addTestResult('Settings Button Click', true, 'Settings button click triggered');
                
                // Check if popup became visible
                setTimeout(() => {
                    const popup = document.getElementById('settings-popup');
                    if (popup && popup.style.display === 'block') {
                        addTestResult('Settings Popup Visible', true, 'Settings popup is now visible');
                    } else {
                        addTestResult('Settings Popup Visible', false, 'Settings popup is not visible');
                    }
                }, 100);
                
            } catch (error) {
                addTestResult('Settings Button Click', false, 'Error clicking settings button: ' + error.message);
            }
        }
        
        function testSaveButton() {
            console.log('=== Testing Save Button ===');
            
            // First make sure settings popup is visible
            const popup = document.getElementById('settings-popup');
            if (!popup || popup.style.display !== 'block') {
                addTestResult('Save Button Test', false, 'Settings popup not visible, cannot test save button');
                return;
            }
            
            // Check if save button exists
            const saveBtn = document.getElementById('settings-save');
            if (!saveBtn) {
                addTestResult('Save Button Exists', false, 'Save button not found in DOM');
                return;
            }
            
            addTestResult('Save Button Exists', true, 'Save button found');
            
            // Check if saveSettings function exists
            if (typeof saveSettings !== 'function') {
                addTestResult('saveSettings Function', false, 'saveSettings function not found');
                return;
            }
            
            addTestResult('saveSettings Function', true, 'saveSettings function exists');
            
            // Try to trigger click
            try {
                saveBtn.click();
                addTestResult('Save Button Click', true, 'Save button click triggered');
            } catch (error) {
                addTestResult('Save Button Click', false, 'Error clicking save button: ' + error.message);
            }
        }
        
        function testExportButton() {
            console.log('=== Testing Export Button ===');
            
            // First make sure settings popup is visible
            const popup = document.getElementById('settings-popup');
            if (!popup || popup.style.display !== 'block') {
                addTestResult('Export Button Test', false, 'Settings popup not visible, cannot test export button');
                return;
            }
            
            // Check if export button exists
            const exportBtn = document.getElementById('settings-export');
            if (!exportBtn) {
                addTestResult('Export Button Exists', false, 'Export button not found in DOM');
                return;
            }
            
            addTestResult('Export Button Exists', true, 'Export button found');
            
            // Check if exportData function exists
            if (typeof exportData !== 'function') {
                addTestResult('exportData Function', false, 'exportData function not found');
                return;
            }
            
            addTestResult('exportData Function', true, 'exportData function exists');
            
            // Try to trigger click
            try {
                exportBtn.click();
                addTestResult('Export Button Click', true, 'Export button click triggered');
            } catch (error) {
                addTestResult('Export Button Click', false, 'Error clicking export button: ' + error.message);
            }
        }
        
        // Initialize
        captureConsole();
        console.log('Test page loaded. Ready to test settings functionality.');
        
        // Add some basic info
        addTestResult('Page Load', true, 'Test page loaded successfully');
        
        // Check for required elements
        const requiredElements = ['settings-btn', 'settings-popup', 'settings-save', 'settings-export', 'settings-back'];
        requiredElements.forEach(id => {
            const element = document.getElementById(id);
            addTestResult(`Element ${id}`, !!element, element ? 'Found' : 'Not found');
        });
        
        // Check for required functions
        const requiredFunctions = ['showSettings', 'hideSettings', 'saveSettings', 'exportData'];
        requiredFunctions.forEach(func => {
            addTestResult(`Function ${func}`, typeof window[func] === 'function', typeof window[func] === 'function' ? 'Found' : 'Not found');
        });
    </script>
</body>
</html>
